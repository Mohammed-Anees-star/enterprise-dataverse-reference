name: CD — Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME_STAGING: enterprise-ticketing-staging
  AZURE_WEBAPP_NAME_PROD: enterprise-ticketing-prod
  RESOURCE_GROUP: rg-enterprise-ticketing

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/EnterpriseTicketing.sln

      - name: Build
        run: dotnet build src/EnterpriseTicketing.sln --no-restore --configuration Release

      - name: Publish API
        run: |
          dotnet publish src/4-API/EnterpriseTicketing.API/EnterpriseTicketing.API.csproj \
            --no-build \
            --configuration Release \
            --output ./publish/api

      - name: Publish Functions
        run: |
          dotnet publish src/5-Functions/EnterpriseTicketing.Functions/EnterpriseTicketing.Functions.csproj \
            --no-build \
            --configuration Release \
            --output ./publish/functions

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api
          retention-days: 1

      - name: Upload Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-publish
          path: ./publish/functions
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://${{ env.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_STAGING }}
          package: ./publish/api

      - name: Deploy Functions to Staging
        uses: azure/functions-action@v1
        with:
          app-name: enterprise-ticketing-functions-staging
          package: ./publish/functions

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net/health \
            || (echo "Smoke test failed" && exit 1)

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_PROD }}
          package: ./publish/api

      - name: Deploy Functions to Production
        uses: azure/functions-action@v1
        with:
          app-name: enterprise-ticketing-functions-prod
          package: ./publish/functions

      - name: Smoke test production
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/health \
            || (echo "Production smoke test failed" && exit 1)

  deploy-infrastructure:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infrastructure/azure/main.bicep
          parameters: >
            environmentName=prod
            appName=enterprise-ticketing
            tenantId=${{ secrets.AZURE_TENANT_ID }}
            dataverseUrl=${{ secrets.DATAVERSE_URL }}
